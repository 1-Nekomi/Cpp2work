[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpp-homework-judge"
version = "0.1.1"
description = "Word 作业导入、人工复核、AI 辅助检查和 C++ 批量判题工作台"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cpp-homework-import = "homework_import.cli:main"

[tool.setuptools]
packages = ["homework_import"]

[tool.setuptools.package-data]
homework_import = ["*.html"]
