<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C++ 作业判题工作台</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#182b2a;background:#eef3f1;font-size:14px}
*{box-sizing:border-box}body{margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid #c5d4cf;border-radius:8px;background:#fff;padding:8px 12px;color:#183332}
button:hover{background:#e9f2ee}button:disabled{opacity:.55;cursor:wait}
button.primary{background:#176858;border-color:#176858;color:#fff}button.primary:hover{background:#12584b}
button.danger{color:#a3342b}button.ghost{border-color:transparent;background:transparent}
input,select,textarea{border:1px solid #b9cbc5;border-radius:7px;padding:8px 10px;background:#fff;max-width:100%}
textarea{width:100%;line-height:1.55;resize:vertical}
h1{font-size:20px;margin:0}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}
p{line-height:1.65;margin:8px 0}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #d8e4df;padding:12px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{min-width:220px}.sub{color:#637c73;font-size:12px;margin-top:4px}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav button{border-color:transparent;background:transparent;padding:8px 10px}
nav button.active{background:#e2f1ea;color:#12584b;font-weight:600}
.header-actions{display:flex;gap:8px;align-items:center}
#job-badge{font-size:12px;padding:5px 9px;border-radius:20px;background:#e7eee9;color:#38594a}
#job-badge.running{background:#fff0cf;color:#875815}#job-badge.done{background:#dff4e8;color:#176858}
#job-badge.error{background:#fbe4df;color:#97382a}
main{padding:18px 20px 80px;max-width:1500px;margin:0 auto}
.panel{background:#fff;border:1px solid #d9e4df;border-radius:12px;padding:16px;margin-bottom:16px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.metric{background:#fff;border:1px solid #d9e4df;border-radius:10px;padding:12px}
.metric strong{display:block;font-size:24px;color:#176858}.metric span{color:#637c73;font-size:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notice{border-radius:8px;padding:10px 12px;background:#f4f8f6;border:1px solid #d8e5df;white-space:pre-wrap;line-height:1.55}
.notice.warn{background:#fff7e6;border-color:#f0dfb6;color:#7b5712}
.notice.error{background:#fdf0ed;border-color:#f0c9bf;color:#8f3224}
.small{font-size:12px;color:#637c73}
.workspace{display:grid;grid-template-columns:310px minmax(0,1fr);gap:14px;align-items:start}
.student-list{max-height:calc(100vh - 250px);overflow:auto}
.student-item{width:100%;text-align:left;border:0;border-bottom:1px solid #edf2ef;border-radius:0;padding:11px 10px;background:#fff}
.student-item.selected{background:#e4f1eb;border-left:4px solid #176858}
.badge{display:inline-block;font-size:11px;border-radius:5px;padding:2px 6px;background:#e7eee9;color:#38594a;margin:3px 4px 0 0}
.badge.warn{background:#fff0d0;color:#875815}.badge.bad{background:#fbe4df;color:#97382a}
.badge.good{background:#dff4e8;color:#176858}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button.active{background:#176858;color:#fff;border-color:#176858}
.code{background:#10211f;color:#d9efe8;border-radius:9px;padding:10px 0;overflow:auto;max-height:440px;font-family:Consolas,"Cascadia Mono",monospace;font-size:13px;line-height:1.55}
.code-line{display:flex;white-space:pre}
.code-line .ln{display:inline-block;min-width:46px;color:#69857d;text-align:right;padding-right:12px;user-select:none}
pre.plain{white-space:pre-wrap;word-break:break-word;background:#f7faf9;border:1px solid #e3ebe7;border-radius:8px;padding:10px;max-height:300px;overflow:auto;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;border-bottom:1px solid #e8eeeb;padding:8px 6px;vertical-align:top}
th{color:#5c746b;font-weight:600;background:#f7faf8}
.status-pass{color:#176858;font-weight:600}.status-fail{color:#a3342b;font-weight:600}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
label.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#4d665d}
label.field input,label.field select,label.field textarea{font-size:14px;color:#182b2a}
.path-row{display:flex;gap:6px}.path-row input{flex:1}.path-row button{white-space:nowrap}
details{border:1px solid #e4ece8;border-radius:8px;padding:8px 10px;margin:8px 0;background:#fbfdfc}
details summary{cursor:pointer;font-weight:600}
.job-drawer{position:fixed;right:18px;bottom:18px;width:min(560px,calc(100vw - 36px));max-height:58vh;overflow:auto;background:#fff;border:1px solid #cfded8;border-radius:12px;box-shadow:0 12px 36px rgba(20,50,44,.18);padding:14px;z-index:30}
.job-drawer[hidden]{display:none}
.job-log{white-space:pre-wrap;word-break:break-word;background:#10211f;color:#d9efe8;border-radius:8px;padding:10px;max-height:34vh;overflow:auto;font-size:12px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#183332;color:#fff;padding:10px 16px;border-radius:8px;z-index:50;max-width:80vw;white-space:pre-wrap}
.toast.error{background:#8f3224}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 10px}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:14px}
@media(max-width:1050px){.workspace{grid-template-columns:1fr}.split{grid-template-columns:1fr}.student-list{max-height:300px}}

summary{cursor:pointer;font-weight:600;padding:10px 0}details[open]>summary{margin-bottom:8px;border-bottom:1px solid #d9e4df}
.workspace> .panel{position:sticky;top:112px}.requirement{border-top:1px solid #e3ebe7;padding:10px 0}.requirement p{white-space:pre-wrap}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #65a995;outline-offset:2px}
#student-search{width:100%;margin-bottom:12px}.tabs{position:relative}.code{tab-size:4}.panel{box-shadow:0 2px 8px #18333205}
@media(max-width:900px){.workspace>.panel{position:static}.student-list{max-height:240px}}
.problem-images{margin-top:16px}.problem-images figure{margin:12px 0}.problem-images img{display:block;max-width:100%;height:auto;border:1px solid #d9e4df;border-radius:8px;background:#fff}.problem-images figcaption{margin-top:6px}
.test-editor textarea{font-family:Consolas,"Microsoft YaHei",monospace;white-space:pre;overflow:auto}.test-editor .split{margin-bottom:12px}#tc-new-name{width:100%;margin-top:16px}#tc-save-status{margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>C++ 作业判题工作台</h1><div class="sub">导入 · 复核 · 判题 · AI 辅助</div></div>
  <nav id="menu">
    <button data-view="overview">概览</button>
    <button data-view="students">学生与判题</button>
    <button data-view="review">人工复核</button>
    <button data-view="import">导入</button>
    <button data-view="check">语法检查</button>
    <button data-view="audit">审计</button>
    <button data-view="export">导出</button>
    <button data-view="ai-review">AI 复核</button>
    <button data-view="ai-requirements">题意符合性判定</button>
    <button data-view="test-cases">测试用例</button>
    <button data-view="judge-batch">批量判题</button>
    <button data-view="ai-output">AI 输出判定</button>
    <button data-view="settings">设置</button>
  </nav>
  <div class="header-actions"><button id="job-badge" title="查看所有后台任务">空闲</button><button id="refresh">刷新</button></div>
</header>
<main>
  <div id="sync-status" class="small" role="status"></div>
  <section id="view"></section>
</main>
<section id="job-drawer" class="job-drawer" hidden>
  <div class="section-title"><h3 id="job-title">任务</h3><button id="job-close" class="ghost">关闭</button></div>
  <div id="job-list" class="tabs"></div><div id="job-status" class="small"></div>
  <pre id="job-log" class="job-log"></pre>
</section>
<div id="toast" class="toast" hidden></div>
<script>
const TOKEN='__TOKEN__';
const $=id=>document.getElementById(id);
let state={},currentView='overview',currentStudent=null,currentCandidate=null,studentData=null,currentJob=null,busy=false,studentFilter='',autoRefresh=true;
let lastStateAt=0,studentRequest=0,allJobs=[];
const viewDrafts=new Map(), readingStates=new Map();
const jobNames={'prepare':'导入','check':'语法检查','audit':'审计','export':'导出','ai-review':'AI 题意复核','ai-requirements':'题意符合性判定','judge-batch':'批量判题','ai-output':'AI 输出判定','test-ai':'连接测试'};
const statusNames={queued:'排队中',running:'运行中',done:'已完成',error:'失败'};
const requirementNames={pass:'符合',fail:'不符合',unclear:'无法确定'};
function rememberReading(){const h=$('student-detail');if(!h||!h.dataset.readingKey)return;const data={};h.querySelectorAll('[data-read-key]').forEach(n=>data[n.dataset.readKey]={open:n.open,top:n.scrollTop,left:n.scrollLeft});readingStates.set(h.dataset.readingKey,data)}
function restoreReading(h){h.dataset.readingKey=currentStudent+'/'+currentCandidate;const saved=readingStates.get(h.dataset.readingKey)||{};h.querySelectorAll('details,pre').forEach((n,i)=>{n.dataset.readKey=n.dataset.readKey||n.tagName+i;const v=saved[n.dataset.readKey];if(v){if(n.tagName==='DETAILS')n.open=v.open;n.scrollTop=v.top;n.scrollLeft=v.left}})}
function updateJobList(){const box=$('job-list');box.replaceChildren();for(const j of [...allJobs].reverse()){box.append(button((jobNames[j.action]||j.action)+' · '+statusNames[j.status],()=>{currentJob=j;renderJob(j)},currentJob?.id===j.id?'active':''))}const active=allJobs.filter(j=>['running','queued'].includes(j.status));$('job-badge').textContent=active.length?active.length+' 个任务运行中':'任务中心';$('job-badge').className=active.length?'running':''}

const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined&&text!==null)n.textContent=text;if(cls)n.className=cls;return n};
const button=(text,fn,cls='')=>{const n=el('button',text,cls);n.onclick=fn;return n};
const badge=(text,cls='')=>el('span',text,'badge '+(cls||''));
const fmt=value=>JSON.stringify(value,null,2);
let toastTimer;
function toast(message,error=false){$('toast').textContent=message;$('toast').className='toast'+(error?' error':'');$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,error?12000:7000)}
async function api(path,data,params={}){const q=new URLSearchParams({...params,token:TOKEN});const res=await fetch(path+'?'+q,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});let value;try{value=await res.json()}catch(e){value={error:'服务返回格式错误'}}if(!res.ok)throw Error(value.error||'请求失败');return value}
async function safe(fn){try{await fn()}catch(e){toast(e.message,true)}}
function setActive(view){document.querySelectorAll('#menu button').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function showJobBadge(job){const b=$('job-badge');if(!job||!job.status){b.textContent='空闲';b.className='';return}b.textContent={queued:'排队中',running:'运行中',done:'已完成',error:'失败'}[job.status]||job.status;b.className=job.status==='running'||job.status==='queued'?'running':job.status}
async function loadState(){const next=await api('/api/ui/state');const changed=next.workspace!==state.workspace;if(changed){currentStudent=null;currentCandidate=null;studentData=null;readingStates.clear();viewDrafts.clear()}state=next;$('sync-status').textContent=state.sync?.message||'';allJobs=state.jobs||[];lastStateAt=Date.now();updateJobList();if(currentView==='overview')renderOverview();if(currentView==='students'){if(currentStudent&&!(state.students||[]).some(s=>s.id===currentStudent)){studentRequest++;currentStudent=null;currentCandidate=null;studentData=null;$('student-detail')?.replaceChildren(el('p','报告已移除，请选择其他学生。','panel'))}renderStudentList();if(currentStudent)await loadStudent(currentStudent,true);else if(state.students?.length)await loadStudent(state.students[0].id);else $('student-detail')?.replaceChildren(el('p','报告已移除或目录内尚无报告，请添加学生报告。','panel'))}}
function field(label,id,value='',opts={}){const wrap=el('label',label,'field');let input;if(opts.type==='select'){input=el('select');for(const [v,t] of opts.options||[]){const o=el('option',t);o.value=v;input.append(o)}input.value=value??''}else if(opts.type==='textarea'){input=el('textarea');input.rows=opts.rows||3;input.value=value??''}else{input=el('input');input.type=opts.type||'text';input.value=value??'';input.placeholder=opts.placeholder||''}input.id=id;if(opts.min!==undefined)input.min=opts.min;if(opts.step!==undefined)input.step=opts.step;wrap.append(input);if(opts.hint)wrap.append(el('div',opts.hint,'small'));return wrap}
function pathField(label,id,value='',mode='file',filter='',title='选择文件'){const wrap=el('label',label,'field');const row=el('div',undefined,'path-row');const input=el('input');input.id=id;input.value=value??'';const pick=button('选择…',()=>safe(async()=>{const r=await api('/api/ui/select-path',{mode,title,filter});if(r.path)input.value=r.path}));row.append(input,pick);wrap.append(row);return wrap}
function collect(ids){const out={};for(const id of ids){const node=$(id);if(!node)continue;out[id.replace(/^f-/,'').replace(/-/g,'_')]=node.type==='checkbox'?node.checked:node.value}return out}
function formView(title,description,fields,action,submitText='开始'){const content=$('view');content.replaceChildren();const panel=el('div',undefined,'panel');panel.append(el('h2',title));panel.append(el('p',description||'','small'));const grid=el('div',undefined,'form-grid');for(const item of fields){const id=item.querySelector('input,select,textarea')?.id;if(state.settings?.managed&&action!=='prepare'&&['f-workspace','f-exported','f-reports','f-out'].includes(id))continue;grid.append(item)}if(state.settings?.managed&&action!=='prepare')panel.append(el('p','目录已自动绑定：'+state.settings.submissions+'\n工作数据：work · 导出与判题结果：output','notice'));panel.append(grid);const bar=el('div',undefined,'toolbar');bar.style.marginTop='14px';bar.append(button(submitText,()=>safe(()=>startJob(action,collect(fields.map(f=>f.querySelector('input,select,textarea')?.id).filter(Boolean)))),'primary'));panel.append(bar);content.append(panel)}
async function persistActionSettings(action,params){const p={};if(action==='judge-batch'){p.exported=params.exported;p.tests=params.tests;p.reports=params.out;p.judge=params.judge;p.compiler=params.compiler}else if(action==='ai-output'){p.workspace=params.workspace;p.reports=params.reports;p.tests=params.tests}else if(['ai-review','ai-requirements','check','audit'].includes(action)){p.workspace=params.workspace}else if(action==='prepare'){p.teacher=params.teacher;p.submissions=params.submissions}else if(action==='export'&&params.out){p.exported=params.out}if(Object.keys(p).length)await api('/api/ui/settings',p)}
function validateAction(action,p){const need=(ok,msg)=>{if(!ok)throw Error(msg)};if(action==='prepare')need(p.submissions,'请选择学生报告目录；首次绑定还需选择教师任务书');if(action==='check'||action==='audit'||action==='ai-review'||action==='ai-requirements')need(p.workspace,'请填写工作目录');if(action==='export')need(p.workspace&&(p.out||state.settings?.managed),'请填写工作目录和导出目录');if(action==='judge-batch')need((p.exported||state.settings?.managed)&&p.tests&&p.out,'请填写导出目录、测试用例目录和报告输出目录');if(action==='ai-output')need(p.workspace&&p.reports,'请填写工作目录和判题报告目录')}
async function startJob(action,params){if(state.settings?.managed&&action!=='prepare'){params={...params,workspace:state.workspace,exported:state.settings.exported,reports:state.settings.reports};if(action==='judge-batch')params.out=state.settings.reports}if(action==='prepare')params.managed=true;validateAction(action,params);try{await persistActionSettings(action,params)}catch(e){}const r=await api('/api/ui/job',{action,params});currentJob=r.job;allJobs.push(r.job);updateJobList();showJobDrawer();toast('任务已启动');showJobBadge(currentJob)}
function showJobDrawer(){$('job-drawer').hidden=false;if(currentJob){$('job-title').textContent='任务：'+currentJob.action;$('job-status').textContent='状态：'+currentJob.status;$('job-log').textContent=(currentJob.progress||[]).join('\n')}}
function renderJob(job){currentJob=job;$('job-title').textContent=jobNames[job.action]||job.action;$('job-status').textContent='状态：'+statusNames[job.status]+(job.error?'；'+job.error:'');let text=(job.progress||[]).join('\n');if(job.result!=null)text+='\n\n结果：\n'+fmt(job.result);const log=$('job-log');const atEnd=log.scrollHeight-log.scrollTop-log.clientHeight<30;if(log.textContent!==text){log.textContent=text;if(atEnd)log.scrollTop=log.scrollHeight}updateJobList()}
async function tick(){if(busy)return;busy=true;try{const response=await api('/api/ui/job');const previous=new Map(allJobs.map(j=>[j.id,j.status]));allJobs=response.jobs||[];updateJobList();if(currentJob){const latest=allJobs.find(j=>j.id===currentJob.id);if(latest)renderJob(latest)}for(const job of allJobs){if(['done','error'].includes(job.status)&&['running','queued'].includes(previous.get(job.id))){toast((jobNames[job.action]||job.action)+(job.status==='done'?'已完成':'失败：'+job.error),job.status==='error');if(job.status==='done'&&job.action==='prepare'){if(!job.params.managed)await api('/api/ui/workspace',{path:job.params.out});await loadState();showView('students')}if(job.status==='done'&&job.action==='export')await loadState();if($('artifact')&&currentView===job.action)await loadArtifact(job.action)}}if(Date.now()-lastStateAt>4000&&(currentView==='overview'||(currentView==='students'&&autoRefresh)))await loadState()}catch(e){toast(e.message,true)}finally{busy=false}}
function renderOverview(){const c=$('view');c.replaceChildren();const s=state.summary||{};const p=el('div',undefined,'panel');p.append(el('h2','概览'));const m=el('div',undefined,'metrics');for(const [key,label] of [['documents','份报告'],['candidates','段源码'],['auto_ready','自动就绪'],['needs_review','待复核'],['compile_ok','语法通过'],['compile_failed','语法失败'],['document_reviews','文档异常'],['approved','已确认']]){const box=el('div',undefined,'metric');box.append(el('strong',s[key]??0),el('span',label));m.append(box)}p.append(m);if(state.sync?.message)p.append(el('div',state.sync.message,state.sync.status==='error'?'notice warn':'notice'));if(state.missing)p.append(el('div','当前工作目录还没有导入批次。请使用“导入”菜单，或把已有批次目录复制到当前工作目录。','notice warn'));p.append(el('p','教师配置：'+(state.assignment_status==='confirmed'?'已确认':state.assignment_status==='missing'?'未导入':'草稿（未确认不能导出）'),'notice'));const bar=el('div',undefined,'toolbar');bar.append(button('打开人工复核',()=>window.open('/review?token='+encodeURIComponent(TOKEN),'_blank'),'primary'),button('学生与判题',()=>showView('students')),button('AI 复核',()=>showView('ai-review')),button('批量判题',()=>showView('judge-batch')),button('绑定学生报告目录',()=>showView('import')),button('设置',()=>showView('settings')));p.append(bar);c.append(p);const paths=el('div',undefined,'panel');paths.append(el('h3','当前路径'),el('div','工作目录：'+(state.workspace||''),'small'),el('div','导出目录：'+(state.settings?.exported||'（未设置）'),'small'),el('div','判题报告：'+(state.settings?.reports||'（未设置）'),'small'),el('div','测试用例：'+(state.settings?.tests||'（未设置）'),'small'));c.append(paths)}
function renderStudents(){const c=$('view');c.replaceChildren();const layout=el('div',undefined,'workspace');const left=el('div',undefined,'panel');left.append(el('div',undefined,'section-title'));const title=el('h2','学生');left.append(title);const search=el('input');search.placeholder='搜索姓名、学号或文件名';search.value=studentFilter;search.id='student-search';search.oninput=()=>{studentFilter=search.value;renderStudentList()};left.append(search);const auto=el('label');const cb=el('input');cb.type='checkbox';cb.checked=autoRefresh;cb.id='auto-refresh';cb.onchange=()=>{autoRefresh=cb.checked};auto.append(cb,document.createTextNode(' 自动刷新'));left.append(auto);const list=el('div');list.id='student-list';list.className='student-list';left.append(list);const right=el('div');right.id='student-detail';layout.append(left,right);c.append(layout);renderStudentList();const target=currentStudent||(state.students||[]).find(s=>s.report)?.id||(state.students||[])[0]?.id;if(target)loadStudent(target)}
function renderStudentList(){const list=$('student-list');if(!list)return;const signature=JSON.stringify([state.students,studentFilter,currentStudent]);if(list.dataset.signature===signature)return;list.dataset.signature=signature;const oldTop=list.scrollTop;list.replaceChildren();const q=studentFilter.trim().toLowerCase();const rows=(state.students||[]).filter(s=>(s.filename+' '+s.student_id).toLowerCase().includes(q));if(!rows.length){list.append(el('p','没有匹配的学生。','small'));return}for(const s of rows){const b=button('',()=>safe(()=>loadStudent(s.id)),'student-item'+(currentStudent===s.id?' selected':''));b.append(el('div',s.filename));b.append(el('div','学号：'+(s.student_id||'未知'),'small'));const pending=s.candidates.filter(c=>c.state==='needs_review').length;b.append(badge(s.candidates.length+' 段代码'),badge(pending?pending+' 段待复核':'无待复核',pending?'warn':'good'));if(s.report)b.append(badge('判题 '+s.report.score+' 分 · '+s.report.status,s.report.status==='全部通过'?'good':'warn'));list.append(b)}list.scrollTop=oldTop}

function artifactPanel(kind){const panel=el('div',undefined,'panel');const title=el('div',undefined,'section-title');title.append(el('h3',kind==='ai-requirements'?'批量题意判定结果':kind==='ai-review'?'最近 AI 复核建议':'最近 AI 输出判定'),button('刷新',()=>safe(()=>loadArtifact(kind))));panel.append(title);const box=el('div');box.id='artifact';panel.append(box);$('view').append(panel);safe(()=>loadArtifact(kind))}
async function loadArtifact(kind){const box=$('artifact');if(!box)return;const r=await api('/api/ui/artifact',null,{name:kind});box.replaceChildren(el('div','结果文件：'+(r.path||''),'small'));if(!r.rows?.length){box.append(el('p','还没有结果。运行上面的任务后会显示在这里。','small'));return}const columns=kind==='ai-requirements'?['文件','学号','题号','候选','题意结论','说明','逐条要求与证据','警告（不影响题意结论）','错误']:kind==='ai-review'?['文件','候选','题号','AI分诊','置信度','建议动作','要求检查','证据','警告（不影响题意结论）']:['学生目录','题号','用例','AI判定','置信度','建议接受','建议','证据'];const table=el('table');const tr=el('tr');for(const c of columns)tr.append(el('th',c));table.append(tr);for(const row of r.rows){const line=el('tr');for(const c of columns)line.append(el('td',row[c]??''));table.append(line)}box.append(table)}
let testCatalog=null,testProblem=null,testCase=null,testDirty=false,testRequest=0,testSaving=false;
function discardTestEdits(){if(testSaving){toast('正在保存测试用例，请稍候');return false}return !testDirty||window.confirm('测试用例有未保存的修改，是否放弃这些修改？')}
async function renderTests(){
 const request=++testRequest;const workspace=state.workspace;
 const catalog=await api('/api/ui/test-cases');
 if(request!==testRequest||currentView!=='test-cases'||workspace!==state.workspace)return;
 testCatalog=catalog;testDirty=false;
 if(!catalog.problems.some(p=>p.id===testProblem))testProblem=catalog.problems[0]?.id||null;
 const view=$('view');view.replaceChildren();
 const header=el('div',undefined,'panel');header.append(el('h2','测试用例'),el('p','编辑用例说明、输入与预期输出，点击保存立即写入当前测试目录。空格和末尾换行参与输出比对。'),el('div','当前测试目录：'+catalog.directory,'notice'));
 header.append(el('p','修改输入或预期输出后，下次批量判题会自动重新执行；修改说明不会影响判题。保存和删除前会自动备份原文件。','small'));
 const controls=el('div',undefined,'toolbar');
 const select=el('select');select.id='tc-problem';select.setAttribute('aria-label','选择题目');
 for(const problem of catalog.problems){const option=el('option',problem.title+' · '+problem.id);option.value=problem.id;select.append(option)}select.value=testProblem||'';
 select.onchange=()=>{if(!discardTestEdits()){select.value=testProblem||'';return}testProblem=select.value;testDirty=false;safe(()=>selectTestProblem())};
 const number=el('input');number.type='number';number.min=1;number.placeholder='新题号';number.id='tc-new-problem';number.setAttribute('aria-label','新增题号');
 controls.append(select,number,button('添加题目',()=>safe(async()=>{if(!discardTestEdits())return;const value=Number(number.value);if(!Number.isInteger(value)||value<1||value>9999)throw Error('请输入 1–9999 的题号');const id='p'+value;if(!testCatalog.problems.some(p=>p.id===id)){testCatalog.problems.push({id,title:'第 '+value+' 题',statement:'',cases:[]});const option=el('option','第 '+value+' 题 · '+id);option.value=id;select.append(option)}testProblem=id;select.value=id;testDirty=false;await selectTestProblem()})),button('重新加载',()=>{if(discardTestEdits())safe(renderTests)}));header.append(controls);view.append(header);
 const layout=el('div',undefined,'workspace');const list=el('div',undefined,'panel');list.id='tc-list';const editor=el('div',undefined,'panel test-editor');editor.id='tc-editor';layout.append(list,editor);view.append(layout);await selectTestProblem();
}
async function selectTestProblem(){
 testCase=null;testRequest++;const list=$('tc-list'),editor=$('tc-editor');if(!list||!editor)return;list.replaceChildren();editor.replaceChildren(el('p','选择一个用例，或填写名称新增用例。','small'));
 const problem=testCatalog.problems.find(p=>p.id===testProblem);if(!problem){list.append(el('p','先添加题目，再创建测试用例。'));return}
 list.append(el('h3',problem.title));if(problem.statement){const detail=el('details');detail.append(el('summary','查看题目说明'),el('pre',problem.statement,'plain'));list.append(detail)}
 for(const c of problem.cases){const b=button(c.name+((c.missing_input||c.missing_expected)?' · 文件未配对':''),()=>{if(discardTestEdits())safe(()=>openTestCase(c.name))},'student-item');if(c.description)b.append(el('div',c.description,'small'));if(c.error)b.append(el('div',c.error,'small'));list.append(b)}
 const name=el('input');name.id='tc-new-name';name.placeholder='例如 case3';name.setAttribute('aria-label','新增用例名称');let n=1;while(problem.cases.some(c=>c.name==='case'+n))n++;name.value='case'+n;
 list.append(name,button('新增用例',()=>{if(discardTestEdits())safe(()=>openTestCase(name.value,true))}));
 if(problem.cases.length)await openTestCase(problem.cases[0].name);
}
async function openTestCase(name,creating=false){
 const request=++testRequest;const problem=testProblem;const response=await api('/api/ui/test-cases',null,{problem,name});
 if(request!==testRequest||currentView!=='test-cases'||problem!==testProblem)return;
 if(response.directory!==testCatalog.directory)throw Error('测试目录已切换，请重新加载模块');
 const c=response.case;if(creating&&c.exists)throw Error('同名用例已存在，请从列表选择或换一个名称');testCase=c;testDirty=false;
 const editor=$('tc-editor');editor.replaceChildren();editor.append(el('h3',problem+' / '+name),el('div',name+'.in（输入） + '+name+c.expected_extension+'（预期输出）','small'));
 if(c.missing_input||c.missing_expected)editor.append(el('p','保存后会创建缺失的输入或预期输出文件。','notice'));
 const description=field('用例说明（测试目的、边界条件等）','tc-description',c.description,{type:'textarea',rows:3});
 const input=field('输入（.in）','tc-input',c.input,{type:'textarea',rows:8});
 const expected=field('预期输出（'+c.expected_extension+'）','tc-expected',c.expected,{type:'textarea',rows:8});
 const columns=el('div',undefined,'split');columns.append(input,expected);editor.append(description,columns);
 const status=el('div',c.exists?'已加载':'新用例，尚未保存','small');status.id='tc-save-status';
 for(const field of [description,input,expected])field.querySelector('textarea').oninput=()=>{testDirty=true;status.textContent='有未保存的修改'};
 const bar=el('div',undefined,'toolbar');
 bar.append(button('保存用例',()=>safe(()=>saveTestCase(false)),'primary'));if(c.exists)bar.append(button('删除用例',()=>{if(window.confirm('删除 '+name+' 的输入、预期输出及说明？原文件会保留备份。'))safe(()=>saveTestCase(true))},'danger'));editor.append(bar,status);
}
async function saveTestCase(deleting){
 const c=testCase;if(!c||testSaving)return;testSaving=true;
 const buttons=Array.from($('tc-editor').querySelectorAll('button'));buttons.forEach(b=>b.disabled=true);
 const payload={action:deleting?'delete':'save',directory:testCatalog.directory,problem:c.problem,name:c.name,version:c.version,input:$('tc-input').value,expected:$('tc-expected').value,description:$('tc-description').value};
 try{const result=await api('/api/ui/test-cases',payload);testDirty=false;toast(deleting?'用例已删除，原文件已备份':result.data_changed?'已保存到测试目录；下次批量判题会自动重判':'用例说明已保存');await renderTests();if(!deleting&&currentView==='test-cases')await openTestCase(c.name)}finally{testSaving=false;buttons.forEach(b=>b.disabled=false)}
}
window.addEventListener('beforeunload',event=>{if(testDirty){event.preventDefault();event.returnValue=''}});
function showView(view){if(currentView==='test-cases'&&view!=='review'&&!discardTestEdits())return;if(view==='review'){window.open('/review?token='+encodeURIComponent(TOKEN),'_blank');return}rememberReading();viewDrafts.set(currentView,collect(Array.from($('view').querySelectorAll('[id^=f-]')).filter(n=>n.type!=='password').map(n=>n.id)));studentRequest++;testRequest++;testDirty=false;currentView=view;setActive(view);$('view').replaceChildren();if(view==='overview')renderOverview();else if(view==='students')renderStudents();else if(view==='settings')renderSettings();else if(view==='test-cases')safe(renderTests);else renderActionView(view);const draft=viewDrafts.get(view);if(draft)for(const [k,v] of Object.entries(draft)){const n=$('f-'+k.replace(/_/g,'-'));if(n){if(n.type==='checkbox')n.checked=v;else n.value=v}}}
document.querySelectorAll('#menu button').forEach(b=>b.onclick=()=>safe(async()=>{if(b.dataset.view==='students'&&currentView==='students'){await loadState();return}showView(b.dataset.view)}));
$('refresh').onclick=()=>safe(async()=>{if(currentView==='test-cases'){if(discardTestEdits())await renderTests();return}await loadState();if(currentView==='students'&&currentStudent)await loadStudent(currentStudent,true);toast('已刷新')});
$('job-badge').onclick=()=>{if(!currentJob)currentJob=allJobs.at(-1);showJobDrawer();if(currentJob)renderJob(currentJob);updateJobList()};
$('job-close').onclick=()=>{$('job-drawer').hidden=true};
setInterval(tick,1500);
safe(async()=>{await loadState();showView('overview')});
</script>
