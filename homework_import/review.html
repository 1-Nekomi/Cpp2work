<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>作业导入与复核</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#183332;background:#f3f6f5;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #c8d6d1;border-radius:7px;background:white;padding:8px 12px;color:#183332}button:hover{background:#eaf2ef}button:disabled{opacity:.5;cursor:wait}button.primary{background:#176858;color:white;border-color:#176858}button.danger{color:#a3342b}input,select,textarea{border:1px solid #bdccc7;border-radius:6px;padding:8px;background:white;max-width:100%}textarea{width:100%;line-height:1.6;resize:vertical}h1{font-size:21px;margin:0}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}p{line-height:1.65}header{background:#fff;border-bottom:1px solid #dbe4e0;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.sub{color:#637c73;font-size:12px;margin-top:6px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.metrics{display:flex;gap:12px;padding:14px 24px;flex-wrap:wrap}.metric{background:white;border:1px solid #dde6e2;padding:10px 18px;border-radius:8px}.metric strong{font-size:22px;margin-right:8px}main{display:grid;grid-template-columns:285px minmax(0,1fr);gap:16px;padding:0 24px 24px}aside{background:#fff;border:1px solid #dbe4e0;border-radius:10px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 30px);overflow:auto}.filter{padding:14px;border-bottom:1px solid #e5ece8}.filter input{width:100%;margin:8px 0}.doc-button{display:block;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid #edf1ef;padding:12px 14px;word-break:break-all}.doc-button.selected{background:#e4f1eb;border-left:4px solid #176858}.badge{display:inline-block;font-size:12px;border-radius:5px;padding:3px 7px;background:#e7eee9;color:#38594a;margin:4px 5px 0 0}.badge.warn{background:#fff0d0;color:#875815}.badge.bad{background:#fbe4df;color:#97382a}.panel{background:white;border:1px solid #dbe4e0;border-radius:10px;padding:18px;min-width:0;margin-bottom:14px}.notice{background:#fff5df;border:1px solid #ecd3a0;border-radius:7px;padding:10px 12px;line-height:1.65;margin:10px 0;white-space:pre-wrap}.notice.info{background:#edf5f2;border-color:#c9dfd5}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.scroll{max-height:66vh;overflow:auto;min-width:0}.source-block{padding:10px;border-bottom:1px solid #e3eae7}.source-block.selected{background:#f0f8f3;border-left:3px solid #308d6a}.source-block pre{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 Consolas,"Microsoft YaHei",monospace}.source-block img,.sample{max-width:100%;height:auto;display:block;margin:10px 0;border:1px solid #d3dfd9}.block-label{color:#58746a;font-size:12px}.source-block button{font-size:11px;padding:3px 6px;margin-left:6px}.code{background:#102c2b;color:#e5f3ea;border-radius:6px;padding:12px;min-height:180px;overflow:auto;font:13px/1.65 Consolas,"Microsoft YaHei",monospace;white-space:pre}.code-line{display:block}.line-number{display:inline-block;color:#86b2a2;width:38px;cursor:pointer;user-select:none}.form-row{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.form-row label{display:flex;flex-direction:column;gap:5px;flex:1;min-width:100px}.small{font-size:12px;color:#637c73}.task{border-top:1px solid #e3eae7;padding-top:18px;margin-top:18px}.task label{display:block;margin:12px 0 5px}.task .sample{max-height:350px;object-fit:contain;object-position:left}.requirements{border-left:3px solid #c7ded3;padding-left:12px}.toast{position:fixed;bottom:20px;right:20px;max-width:min(620px,90vw);background:#173e36;color:white;padding:16px 20px;border-radius:9px;box-shadow:0 4px 25px #0002;white-space:pre-wrap;z-index:5}.toast.error{background:#862f29}[hidden]{display:none!important}details{margin:12px 0}summary{cursor:pointer}#content{min-width:0}#empty{padding:40px;text-align:center;color:#637c73}@media(max-width:1000px){.split{grid-template-columns:1fr}main{grid-template-columns:230px minmax(0,1fr);padding:0 12px 12px}.metrics{padding:12px}}@media(max-width:680px){main{grid-template-columns:1fr}aside{position:static;max-height:270px}header{align-items:start;padding:14px;flex-direction:column}.scroll{max-height:55vh}}
</style>
<header><div><h1>作业导入与复核</h1><div class="sub">对照原文确认提取结果 · 本地处理 · 保留复核记录</div></div><div class="toolbar"><button id="show-submissions">学生报告</button><button id="show-teacher">教师题目配置</button><button id="refresh">刷新</button><button id="export" class="primary">导出就绪源码</button></div></header>
<div id="metrics" class="metrics"></div>
<main><aside><div class="filter"><strong>提交列表</strong><input id="search" placeholder="搜索姓名或学号" aria-label="搜索姓名或学号"><label><input type="checkbox" id="only-review" checked style="width:auto"> 只看待复核</label><div id="list-count" class="sub"></div></div><div id="documents"></div></aside><section id="content"><div id="empty">正在载入…</div></section></main>
<div id="toast" class="toast" hidden role="status"></div>
<script>
const token='__TOKEN__';let state,currentDoc=null,currentCandidate=null,detail=null,teacherOriginal=null,view='students',fullDocument=false,documentRequest=0;
const $=id=>document.getElementById(id);
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const button=(text,fn,cls='')=>{const n=el('button',text,cls);n.onclick=fn;return n};
const url=(path,params={})=>path+'?'+new URLSearchParams({...params,token});
async function api(path,data,params={}){const res=await fetch(url(path,params),data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const value=await res.json();if(!res.ok)throw Error(value.error||'请求失败');return value;}
let toastTimer;function toast(message,error=false){$('toast').textContent=message;$('toast').className='toast'+(error?' error':'');$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,error?14000:9000);}
async function safe(fn){try{await fn()}catch(e){toast(e.message,true)}}
const labels={auto_ready:'自动就绪',needs_review:'待复核',approved:'人工确认',rejected:'已排除'};
function needsReview(d){return (!!d.issues.length&&!d.review)||d.candidates.some(c=>c.state==='needs_review')}
function badge(text,warn=false){return el('span',text,'badge'+(warn?' warn':''))}
function aiBlock(c){if(!c.ai)return null;const box=el('details');box.append(el('summary','AI辅助建议（仅供参考，不自动改变状态）'));const t=c.ai.triage;if(t){const line=el('div');line.append(el('strong','提取分诊：'),document.createTextNode(`${t.verdict} / 置信度 ${Math.round((t.confidence||0)*100)}% / 建议 ${t.suggested_action}`));box.append(line);if(t.evidence&&t.evidence.length)box.append(el('div',t.evidence.join('\n'),'notice'));if(t.suggested_range)box.append(el('div',`建议范围：${t.suggested_range.start_block} → ${t.suggested_range.end_block} ${t.suggested_range.reason||''}`,'small'))}const r=c.ai.requirements;if(r){const names={main:'入口函数',comments:'注释',symbol_constant:'符号常量',precision_2:'两位小数'};for(const [key,value] of Object.entries(r.deterministic||{}))box.append(el('div',`${names[key]||key}：${value.status} ${value.evidence||''}`,'small'));for(const x of r.requirements||[]){const evidence=(x.ai&&x.ai.evidence)||(x.deterministic&&x.deterministic.evidence)||'';box.append(el('div',`要求${x.index+1}（${x.text}）：${x.status} ${evidence}`,'small'))}}if(c.ai.error)box.append(el('div','AI调用失败：'+c.ai.error,'notice'));return box}
function renderList(){const query=$('search').value.trim().toLowerCase();const docs=state.documents.filter(d=>(!$('only-review').checked||needsReview(d))&&(d.filename+' '+d.student_id).toLowerCase().includes(query));$('documents').replaceChildren();$('list-count').textContent=`显示 ${docs.length} / ${state.documents.length} 份`;
for(const d of docs){const n=button('',()=>safe(()=>openDoc(d.id)),'doc-button'+(currentDoc===d.id?' selected':''));n.append(el('div',d.filename),badge(d.error?'读取异常':`${d.candidates.length} 段代码`,!!d.error));const pending=d.candidates.filter(c=>c.state==='needs_review').length;if(pending)n.append(badge(`${pending} 段待复核`,true));if(d.issues.length&&!d.review)n.append(badge('文档异常',true));$('documents').append(n)}}
function renderMetrics(){const s=state.summary;$('metrics').replaceChildren();for(const [key,label] of [['documents','份报告'],['candidates','段候选源码'],['auto_ready','段自动就绪'],['needs_review','段待复核'],['document_reviews','份文档异常']]){const box=el('div',undefined,'metric');box.append(el('strong',s[key]),document.createTextNode(label));$('metrics').append(box)}}
async function reload(keep=true){state=await api('/api/state');renderMetrics();renderList();if(view==='teacher')return renderTeacher();if(keep&&currentDoc)return openDoc(currentDoc,currentCandidate);const first=state.documents.find(needsReview)||state.documents[0];if(first)return openDoc(first.id);$('content').replaceChildren(el('p','没有提交文件。','panel'))}
async function openDoc(id,cid=null){view='students';currentDoc=id;currentCandidate=null;const request=++documentRequest;$('content').replaceChildren(el('p','正在读取报告…','panel'));const loaded=await api('/api/document',null,{id});if(request!==documentRequest||view!=='students')return;detail=loaded;currentCandidate=cid&&detail.submission.candidates.some(c=>c.id===cid)?cid:(detail.submission.candidates.find(c=>c.state==='needs_review')||detail.submission.candidates[0])?.id;renderList();renderDocument()}
function inputField(label,value,id,type='text'){const wrap=el('label',label);const field=el('input');field.type=type;field.value=value??'';field.id=id;wrap.append(field);return wrap}
function imageNode(im,docid){if(!im.preview)return el('p','该图片格式无法预览，请在原Word中核对。','small');const img=el('img');img.src=url('/asset',{document:docid,name:im.file});img.alt='原文图片';img.loading='lazy';return img}
async function decision(action,extra={}){const result=await api('/api/decision',{revision:state.revision,document_id:currentDoc,candidate_id:currentCandidate,action,...extra});toast('已保存复核记录');await reload();return result}
function renderDocument(){const d=detail.submission;const c=d.candidates.find(c=>c.id===currentCandidate);const content=$('content');content.replaceChildren();const head=el('div',undefined,'panel');head.append(el('h2',d.filename),el('div',d.path,'small'));
const docReview=el('details');docReview.open=d.issues.length>0;docReview.append(el('summary','文档身份、版本与异常复核'));if(d.issues.length)docReview.append(el('div',d.issues.join('\n'),'notice'));const row=el('div',undefined,'form-row');row.append(inputField('确认学号',d.student_id,'student-id'),inputField('文档复核依据（身份、缺题或版本等）',d.review?.note||'','document-note'));docReview.append(row);const bar=el('div',undefined,'toolbar');bar.append(button('确认文档信息已核对',()=>safe(()=>decision('document_approve',{note:$('document-note').value,student_id:$('student-id').value}))),button('排除此份提交',()=>safe(()=>decision('document_reject',{note:$('document-note').value})),'danger'));docReview.append(bar);if(d.review)docReview.append(el('p','文档处理记录：'+d.review.note,'small'));head.append(docReview);
const tabs=el('div',undefined,'toolbar');for(const item of d.candidates){const b=button(`第${item.problem_id??'?'}题 · ${labels[item.state]}`,()=>{currentCandidate=item.id;renderDocument()},item.id===currentCandidate?'primary':'');tabs.append(b)}head.append(tabs);content.append(head);
if(!c){content.append(el('div',d.error||'没有源码候选，请核对原文。','panel'));return}
const panel=el('div',undefined,'panel');panel.append(el('h3',`第${c.problem_id??'?'}题 · ${c.id}`));if(c.issues.length)panel.append(el('div',c.issues.join('\n'),'notice'));panel.append(el('p','确认提取仅表示代码忠实于原文，不表示学生答案正确。若编译错误来自学生原文，也可确认提取并保留编译失败记录。','small'));
const split=el('div',undefined,'split'),left=el('div'),right=el('div');left.append(el('h3','原文段落与图片'));const all=el('label');const checkbox=el('input');checkbox.type='checkbox';checkbox.checked=fullDocument;checkbox.onchange=()=>{fullDocument=checkbox.checked;renderDocument()};all.append(checkbox,document.createTextNode(' 显示整份报告（含题面和未选中内容）'));left.append(all);const original=el('div',undefined,'scroll');const chosen=new Set(c.source_map.map(m=>m.block));const context=new Set(c.context_blocks);for(const b of detail.original.blocks){if(!fullDocument&&!context.has(b.id))continue;const block=el('div',undefined,'source-block'+(chosen.has(b.id)?' selected':''));block.id='original-'+b.id;const title=el('div',b.id+' · '+({body:'正文',table:'表格',textbox:'文本框'}[b.context]||b.context),'block-label');title.title=b.location;title.append(button('选为起点',()=>{$('start-block').value=b.id;$('start-offset').value=0}),button('选为终点',()=>{$('end-block').value=b.id;$('end-offset').value=b.text.length}));block.append(title,el('pre',b.text||'（空段落）'));for(const im of b.images)block.append(imageNode(im,d.id));original.append(block)}left.append(original);
right.append(el('h3','提取源码（点击行号定位原文）'));const code=el('div',undefined,'code scroll');c.code.replace(/\n$/,'').split('\n').forEach((text,i)=>{const line=el('span',undefined,'code-line');const num=el('span',String(i+1),'line-number');num.onclick=()=>{const map=c.source_map[i];if(map)$('original-'+map.block)?.scrollIntoView({block:'center',behavior:'smooth'})};line.append(num,document.createTextNode(text||' '));code.append(line)});right.append(code);if(c.compile){const details=el('details');details.append(el('summary',c.compile.status==='ok'?'语法编译通过（未执行）':'查看编译错误'));const log=el('pre',c.compile.log||'没有编译诊断。');log.style.whiteSpace='pre-wrap';log.style.overflowWrap='anywhere';details.append(log);right.append(details)}split.append(left,right);panel.append(split);const aiPanel=aiBlock(c);if(aiPanel)panel.append(aiPanel);
const form=el('div',undefined,'form-row');form.append(inputField('所属题号',c.problem_id,'problem-id','number'),inputField('复核依据',c.review?.note||'','candidate-note'));panel.append(form);const actions=el('div',undefined,'toolbar');const info=()=>({problem_id:Number($('problem-id').value),note:$('candidate-note').value});actions.append(button('确认提取正确',()=>safe(()=>decision('approve',info())),'primary'),button('排除此候选',()=>safe(()=>decision('reject',info())),'danger'));panel.append(actions);
const range=el('details');range.append(el('summary','修正提取范围或补充另一道题（只从原文选取，不改写代码）'));const first=c.source_map[0],last=c.source_map.at(-1);const rangeRow=el('div',undefined,'form-row');rangeRow.append(inputField('起始段落',first?.block||'','start-block'),inputField('起始字符偏移（从0起）',first?.start||0,'start-offset','number'),inputField('结束段落',last?.block||'','end-block'),inputField('结束字符偏移（不含该字符）',last?.end??'','end-offset','number'));range.append(rangeRow);range.append(el('p','可点击左侧段落上的起点／终点按钮。题号与源码在同一段时，用字符偏移排除题号；选取后请再次对照并确认。','small'));
const selectInfo=()=>({...info(),start_block:$('start-block').value.trim(),end_block:$('end-block').value.trim(),start_offset:Number($('start-offset').value),end_offset:$('end-offset').value===''?null:Number($('end-offset').value)});const rb=el('div',undefined,'toolbar');rb.append(button('重新提取此候选',()=>safe(()=>decision('select',selectInfo()))),button('以此范围新增候选',()=>safe(()=>decision('add',selectInfo()))));range.append(rb);panel.append(range);content.append(panel)}
async function renderTeacher(){view='teacher';if(!teacherOriginal)teacherOriginal=(await api('/api/document',null,{id:'teacher'})).original;if(view!=='teacher')return;const config=structuredClone(state.assignment);const content=$('content');content.replaceChildren();const panel=el('div',undefined,'panel');panel.append(el('h2','教师题目配置'),el('div',config.source.path,'small'),el('div',config.status==='confirmed'?'已确认。修改并保存为草稿后，需要重新确认才能导出。':'当前为草稿。请核对题面、图片和要求，并逐题确定格式政策后确认。','notice info'));panel.append(el('p','这里整理的是教师要求，不会自动生成标准答案、分值或可执行检查器；学生报告不能覆盖本配置。','small'));
const globals=el('details');globals.open=true;globals.append(el('summary','整份作业的共同要求'));for(const g of config.global_requirements){const t=el('textarea');t.rows=3;t.value=g.text;t.setAttribute('aria-label','共同要求');t.oninput=()=>g.text=t.value;globals.append(t)}panel.append(globals);
const taskContainer=el('div');function taskCard(p){const card=el('div',undefined,'task');card.append(el('h3',`第${p.id}题`));const numberLabel=el('label','题号');const numberInput=el('input');numberInput.type='number';numberInput.value=p.id;numberInput.setAttribute('aria-label',`第${p.id}题编号`);numberInput.oninput=()=>p.id=Number(numberInput.value);numberLabel.append(numberInput);card.append(numberLabel,button('移除此题（保存时生效）',()=>{config.problems.splice(config.problems.indexOf(p),1);card.remove()},'danger'));const title=el('input');title.value=p.title;title.setAttribute('aria-label',`第${p.id}题标题`);title.oninput=()=>p.title=title.value;card.append(title);card.append(el('label','题目原文（可核对后修订）'));const statement=el('textarea');statement.rows=5;statement.value=p.statement;statement.setAttribute('aria-label',`第${p.id}题题面`);statement.oninput=()=>p.statement=statement.value;card.append(statement);for(const im of p.images||[])card.append(imageNode(im,'teacher'));card.append(el('label','输出格式政策'));const select=el('select');select.setAttribute('aria-label',`第${p.id}题格式政策`);for(const [value,text] of [['undecided','待确认'],['strict','严格遵循题目样张'],['tolerant','允许约定的排版差异（请在备注中说明）'],['results_only','只要求结果字段正确']]){const option=el('option',text);option.value=value;select.append(option)}select.value=p.format_policy;select.onchange=()=>p.format_policy=select.value;card.append(select);card.append(el('label','逐项要求'));const reqs=el('div',undefined,'requirements');for(const r of p.requirements){const t=el('textarea');t.rows=2;t.value=r.text;t.setAttribute('aria-label',`第${p.id}题要求`);t.oninput=()=>r.text=t.value;reqs.append(t,el('div','出处：'+(r.source_blocks||[]).join('、'),'small'))}card.append(reqs);card.append(button('增加一项要求',()=>{const r={text:'',source_blocks:[],status:'proposed'};p.requirements.push(r);const t=el('textarea');t.rows=2;t.setAttribute('aria-label','新增要求');t.oninput=()=>r.text=t.value;reqs.append(t);t.focus()}));card.append(el('label','教师备注（如允许的常量形式、注释尺度、格式容错范围）'));const notes=el('textarea');notes.rows=2;notes.value=p.teacher_notes||'';notes.setAttribute('aria-label',`第${p.id}题备注`);notes.oninput=()=>p.teacher_notes=notes.value;card.append(notes);const source=el('details');source.append(el('summary','查看带出处的原文片段'));const wanted=new Set(p.source_blocks||[]);for(const b of teacherOriginal.blocks){if(wanted.has(b.id)){source.append(el('div',b.id+' · '+b.location,'small'),el('p',b.text))}}card.append(source);taskContainer.append(card)}for(const p of config.problems)taskCard(p);panel.append(taskContainer);
panel.append(button('手动补充题目',()=>{const id=Math.max(0,...config.problems.map(p=>p.id))+1;const p={id,title:`第${id}题`,statement:'',source_blocks:[],images:[],requirements:[],format_policy:'undecided',teacher_notes:'',tests:[],checker:'not_configured'};config.problems.push(p);taskCard(p)}));const actions=el('div',undefined,'toolbar');actions.style.marginTop='20px';const save=confirm=>safe(async()=>{const cleaned=structuredClone(config);cleaned.global_requirements=cleaned.global_requirements.filter(g=>g.text.trim());for(const p of cleaned.problems)p.requirements=p.requirements.filter(r=>r.text.trim());await api('/api/decision',{revision:state.revision,action:'assignment',assignment:cleaned,confirm});toast(confirm?'教师配置已确认':'草稿已保存');await reload()});actions.append(button('保存草稿',()=>save(false)),button('已核对原文，确认此配置',()=>save(true),'primary'));panel.append(actions);content.append(panel)}
$('search').oninput=renderList;$('only-review').onchange=renderList;$('refresh').onclick=()=>safe(()=>reload());$('show-teacher').onclick=()=>safe(()=>renderTeacher());$('show-submissions').onclick=()=>safe(async()=>{view='students';await reload()});$('export').onclick=()=>safe(async()=>{const r=await api('/api/export',{});toast(`已导出 ${r.exported} 段源码，跳过 ${r.skipped} 项。\n保存位置：${r.path}\n跳过原因见 manifest.json。`)});safe(()=>reload(false));
</script>
</html>
